
name: Build Wheels

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Install OpenMP on macOS
      
      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
      
          # Download the exact Homebrew formula version used by this runner.
          curl -fsSL \
            https://raw.githubusercontent.com/Homebrew/homebrew-core/ffc79088768f59d49d304f3ff00de576b4ea8f69/Formula/lib/libomp.rb \
            -o /tmp/libomp.rb
      
          # Override Homebrew's deployment target in BOTH CMake builds.
          python3 - <<'PY'
          from pathlib import Path
      
          formula = Path("/tmp/libomp.rb")
          source = formula.read_text()
      
          old = "*std_cmake_args"
          new = (
              '*std_cmake_args, '
              '"-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0", '
              '"-DCMAKE_OSX_ARCHITECTURES=arm64"'
          )
      
          assert source.count(old) == 2, "Unexpected Homebrew formula layout"
      
          formula.write_text(source.replace(old, new))
          PY
      
          # Build the patched formula from source.
          brew uninstall --ignore-dependencies libomp || true
          brew install --build-from-source /tmp/libomp.rb
      
          # Verify the actual runtime deployment target.
          echo "Checking libomp deployment target:"
          otool -l "$(brew --prefix libomp)/lib/libomp.dylib" |
            grep -A 5 LC_BUILD_VERSION
      
          # Fail immediately if the runtime is not compatible with macOS 11.
          otool -l "$(brew --prefix libomp)/lib/libomp.dylib" |
            grep -A 5 LC_BUILD_VERSION |
            grep -q "minos 11.0"

      # Cache cibuildwheel's downloaded tools
      - name: Cache cibuildwheel
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibw-${{ runner.os }}-

            # Set up the MSVC environment needed by clang-cl
      - name: Set up MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Install LLVM and its OpenMP runtime
      - name: Install LLVM on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress

          "$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_PATH
          "LLVM_ROOT=C:/Program Files/LLVM" >> $env:GITHUB_ENV

      - name: Check LLVM installation
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "LLVM_ROOT=$env:LLVM_ROOT"
          Get-ChildItem "$env:ProgramFiles\LLVM" -Recurse -Filter omp.h |
            Select-Object -ExpandProperty FullName
          Get-ChildItem "$env:ProgramFiles\LLVM" -Recurse -Filter libomp.lib |
            Select-Object -ExpandProperty FullName
          Get-ChildItem "$env:ProgramFiles\LLVM" -Recurse -Filter libomp.dll |
            Select-Object -ExpandProperty FullName

      - name: Check libomp deployment target
        if: runner.os == 'macOS'
        run: |
          otool -l "$(brew --prefix libomp)/lib/libomp.dylib" | grep -A 5 LC_BUILD_VERSION

      # Build wheels
      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=11.0
            CMAKE_OSX_DEPLOYMENT_TARGET=11.0
          CIBW_ARCHS_WINDOWS: AMD64
          CMAKE_GENERATOR: Ninja

          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"

          CIBW_ENVIRONMENT_WINDOWS: "CC=clang-cl CXX=clang-cl"

          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} -v {wheel}"

          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

      # Upload generated wheels
      - uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
